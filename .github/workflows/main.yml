name: Build

on:
  workflow_dispatch:
  push:
    branches:
      master
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        zephyr_version: [3.7.0, 2.7.3, 2.3.0]
        board: [qemu_x86, qemu_cortex_m3, qemu_cortex_r5, nucleo_l552ze_q, native_posix, qemu_riscv32, qemu_riscv64]
        test: [samples/rust-app, samples/no_std, samples/serial]
        exclude:
          - board: qemu_riscv32
            zephyr_version: 2.3.0
          - board: qemu_riscv64
            zephyr_version: 2.3.0
          - board: qemu_riscv32
            zephyr_version: 2.7.3
          - board: qemu_riscv64
            zephyr_version: 2.7.3
          # serial/uart does not exist on posix
          - board: native_posix
            test: samples/serial
          # posix has header issues on Zephyr 3.x
          - board: native_posix
            zephyr_version: 3.7.0
        include:
          - fails: false
          - run: false
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:zephyr-rust-${{ matrix.zephyr_version }}-1.78.0
      credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: |
          west build -d /tmp/build -p auto -b ${{ matrix.board }} ${{ matrix.test }}

      - name: Run
        if: ${{ matrix.run }}
        run: |
          cd /tmp/build
          ninja run || ${{ matrix.fails }}

  # Lint all Rust crates. One Zephyr version/board is enough: clippy results
  # do not meaningfully vary across the matrix. Apps that do not build on the
  # chosen board are reported as skipped (see ci/clippy.sh).
  clippy:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:zephyr-rust-3.7.0-1.78.0
      credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clippy
        # Warnings are fatal so a Rust version bump that introduces new
        # warnings fails this job with a pointer to each one, driving the
        # fixup pass. CLIPPY_STRICT is not enabled: the native_posix-only
        # tests cannot build on qemu_x86 and are reported as skipped.
        env:
          CLIPPY_ARGS: "-D warnings"
        run: ./ci/clippy.sh
