name: Build

on:
  workflow_dispatch:
  push:
    branches:
      master
  pull_request:

jobs:
  # ci/matrix.py is the single source of the build matrix (boards,
  # whitelists, exclusions, and which samples run); this job only renders
  # it for fromJSON below. Run it locally with ci/build-all.sh.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate build matrix
        id: gen
        run: |
          matrix=$(python3 ci/matrix.py)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:zephyr-rust-${{ matrix.zephyr_version }}-1.78.0
      credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: |
          west build -d /tmp/build -p auto -b ${{ matrix.board }} ${{ matrix.test }}

      # Only the matrix entries marked run=true execute: the samples
      # verified to exit on their own (ci/matrix.py RUN_CASES). The
      # intentional user-mode page fault makes the emulator return
      # status ${{ matrix.expected_status }}; the output assertion is
      # independent of that status.
      - name: Run
        if: matrix.run
        timeout-minutes: 3
        run: |
          set +e
          bash ci/run-sample.sh > /tmp/sample-run.log 2>&1
          status=$?
          set -e
          cat /tmp/sample-run.log
          grep -F '${{ matrix.expected_output }}' /tmp/sample-run.log
          if [ "$status" -ne "${{ matrix.expected_status }}" ]; then
            echo "sample exited with $status, expected ${{ matrix.expected_status }}" >&2
            exit 1
          fi

  # Lint all Rust crates. One Zephyr version/board is enough: clippy results
  # do not meaningfully vary across the matrix (except code gated on the
  # zephyrNNN version cfgs, which is only checked for this one version; see
  # AGENTS.md "Validation workflow for changes"). Apps that do not build on
  # the chosen board fail the job (see ci/clippy.sh).
  clippy:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:zephyr-rust-3.7.0-1.78.0
      credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clippy
        # Warnings are fatal so a Rust version bump that introduces new
        # warnings fails this job with a pointer to each one, driving the
        # fixup pass. CLIPPY_STRICT is at its strict default: an app that
        # stops building on the clippy board fails the job.
        env:
          CLIPPY_ARGS: "-D warnings"
        run: ./ci/clippy.sh
