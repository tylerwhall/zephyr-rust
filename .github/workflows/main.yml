name: Build

on:
  workflow_dispatch:
  push:
    branches:
      master
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        zephyr_version: [3.7.0, 2.7.3, 2.3.0]
        board: [qemu_x86, qemu_cortex_m3, qemu_cortex_r5, nucleo_l552ze_q, native_posix, qemu_riscv32, qemu_riscv64]
        # Tests are built on the boards from their tests/*/testcase.yaml
        # platform_whitelist (see ci/build-all.sh); the exclusions below
        # keep the rest of the board list out of the matrix.
        test: [samples/rust-app, samples/no_std, samples/serial, tests/rust, tests/semaphore, tests/posix-clock, tests/eeprom]
        exclude:
          - board: qemu_riscv32
            zephyr_version: 2.3.0
          - board: qemu_riscv64
            zephyr_version: 2.3.0
          - board: qemu_riscv32
            zephyr_version: 2.7.3
          - board: qemu_riscv64
            zephyr_version: 2.7.3
          # serial/uart does not exist on posix
          - board: native_posix
            test: samples/serial
          # the cross-compiled sysroot has no std for the native_posix
          # target on Zephyr 3.x (rustc E0463)
          - board: native_posix
            zephyr_version: 3.7.0
          # tests are only built on their testcase.yaml whitelist
          - board: qemu_cortex_r5
            test: tests/rust
          - board: qemu_cortex_r5
            test: tests/semaphore
          - board: qemu_cortex_r5
            test: tests/posix-clock
          - board: qemu_cortex_r5
            test: tests/eeprom
          - board: nucleo_l552ze_q
            test: tests/rust
          - board: nucleo_l552ze_q
            test: tests/semaphore
          - board: nucleo_l552ze_q
            test: tests/posix-clock
          - board: nucleo_l552ze_q
            test: tests/eeprom
          - board: qemu_riscv32
            test: tests/rust
          - board: qemu_riscv32
            test: tests/semaphore
          - board: qemu_riscv32
            test: tests/posix-clock
          - board: qemu_riscv32
            test: tests/eeprom
          - board: qemu_riscv64
            test: tests/eeprom
          - board: qemu_cortex_m3
            test: tests/eeprom
          - board: native_posix
            test: tests/eeprom
          - board: qemu_riscv64
            test: tests/rust
          - board: qemu_riscv64
            test: tests/semaphore
          - board: qemu_riscv64
            test: tests/posix-clock
          - board: qemu_riscv64
            test: tests/eeprom
        include:
          - fails: false
          # Only qemu_x86 rust-app/no_std runs are verified to exit; their
          # intentional user-mode page fault makes ninja return status 1.
          - zephyr_version: 3.7.0
            board: qemu_x86
            test: samples/rust-app
            run: true
            fails: true
            expected: Next call will crash if userspace is working.
          - zephyr_version: 2.7.3
            board: qemu_x86
            test: samples/rust-app
            run: true
            fails: true
            expected: Next call will crash if userspace is working.
          - zephyr_version: 2.3.0
            board: qemu_x86
            test: samples/rust-app
            run: true
            fails: true
            expected: Next call will crash if userspace is working.
          - zephyr_version: 3.7.0
            board: qemu_x86
            test: samples/no_std
            run: true
            fails: true
            expected: Next call will crash if userspace is working.
          - zephyr_version: 2.7.3
            board: qemu_x86
            test: samples/no_std
            run: true
            fails: true
            expected: Next call will crash if userspace is working.
          - zephyr_version: 2.3.0
            board: qemu_x86
            test: samples/no_std
            run: true
            fails: true
            expected: Next call will crash if userspace is working.
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:zephyr-rust-${{ matrix.zephyr_version }}-1.78.0
      credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build
        run: |
          west build -d /tmp/build -p auto -b ${{ matrix.board }} ${{ matrix.test }}

      - name: Run
        if: ${{ matrix.run }}
        timeout-minutes: 3
        run: |
          set +e
          bash ci/run-sample.sh > /tmp/sample-run.log 2>&1
          status=$?
          set -e
          cat /tmp/sample-run.log
          grep -F '${{ matrix.expected }}' /tmp/sample-run.log
          if [ "${{ matrix.fails }}" = "true" ]; then
            expected_status=1
          else
            expected_status=0
          fi
          if [ "$status" -ne "$expected_status" ]; then
            echo "sample exited with $status, expected $expected_status" >&2
            exit 1
          fi

  # Lint all Rust crates. One Zephyr version/board is enough: clippy results
  # do not meaningfully vary across the matrix (except code gated on the
  # zephyrNNN version cfgs, which is only checked for this one version; see
  # AGENTS.md "Validation workflow for changes"). Apps that do not build on
  # the chosen board fail the job (see ci/clippy.sh).
  clippy:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository }}:zephyr-rust-3.7.0-1.78.0
      credentials:
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clippy
        # Warnings are fatal so a Rust version bump that introduces new
        # warnings fails this job with a pointer to each one, driving the
        # fixup pass. CLIPPY_STRICT is at its strict default: an app that
        # stops building on the clippy board fails the job.
        env:
          CLIPPY_ARGS: "-D warnings"
        run: ./ci/clippy.sh
